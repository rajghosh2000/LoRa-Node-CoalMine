<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LoRa BLE Chat</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f3f3f3; }
    header { background: #222; color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 12px; }
    .card { background: #fff; border-radius: 10px; padding: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    input, button { font-size: 16px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
    input { flex: 1; }
    button { cursor: pointer; background: #007bff; color: white; border: none; font-weight: bold; }
    button:disabled { background: #bbb; cursor: not-allowed; }
    .btn-csv { background: #28a745; }
    .btn-disconnect { background: #dc3545; }
    #log { height: 55vh; overflow-y: auto; padding: 10px; background: #fafafa; border-radius: 8px; border: 1px solid #eee; margin-top: 10px; }
    .msg { margin: 8px 0; padding: 8px 10px; border-radius: 10px; max-width: 85%; word-break: break-word; }
    .in { background: #e8f0ff; }
    .out { background: #e9ffe8; margin-left: auto; }
    .sys { background: #fff3cd; margin: 6px auto; font-size: 13px; text-align: center; }
    .meta { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
    .status-badge { font-size: 12px; padding: 4px 8px; border-radius: 12px; background: #666; color: #fff; }
    .status-badge.connected { background: #28a745; }
  </style>
</head>
<body>
<header>
  <div>
    <div style="font-size:18px;"><b>LoRa Chat</b> (Bluetooth Gateway)</div>
    <div style="font-size:12px;opacity:.8">SX1262 LoRa + nRF52840 BLE</div>
  </div>
  <div id="statusBadge" class="status-badge">Disconnected</div>
</header>

<div class="wrap">
  <div class="card">
    <div class="row">
      <button id="btnConnect" onclick="toggleConnect()" style="flex:1;">🔗 Connect Bluetooth</button>
      <button id="btnCsv" class="btn-csv" onclick="downloadCsv()" disabled>📥 Save Log as CSV</button>
    </div>

    <div class="row">
      <input id="name" placeholder="Your name" value="User" style="max-width:180px;" />
      <div style="flex:1;font-size:13px;color:#666;display:flex;align-items:center;">
        Target: <span id="targetNode" style="font-weight:bold;margin-left:4px;">Auto</span>
      </div>
    </div>

    <div id="log">
      <div class="msg sys">Tap <b>Connect Bluetooth</b> to connect to XIAO_Chat_A or XIAO_Chat_B.</div>
    </div>

    <div class="row">
      <input id="text" placeholder="Type a message..." maxlength="150" disabled />
      <button id="btnSend" onclick="sendMsg()" disabled>Send</button>
    </div>

    <div style="font-size:12px;opacity:.7;margin-top:8px;display:flex;justify-content:space-between;">
      <span>Tip: Keep messages short (&le;150 chars).</span>
      <span id="msgCount">Messages: 0</span>
    </div>
  </div>
</div>

<script>
// Nordic UART Service UUIDs
const NUS_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const NUS_RX_UUID      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; // Phone writes here
const NUS_TX_UUID      = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; // Phone listens here

let bleDevice = null;
let rxCharacteristic = null;
let txCharacteristic = null;
let isConnected = false;
let receiveBuffer = "";

// Chat history array for CSV export
// Schema: { timestamp, timeStr, sender, text, direction, rssi }
const chatHistory = [];

function esc(s) {
  return (s || "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
}

function addToLog(sender, text, type, metaInfo = "") {
  const log = document.getElementById("log");
  const div = document.createElement("div");
  div.className = "msg " + type;

  const now = new Date();
  const timeStr = now.toLocaleTimeString();

  if (type === "sys") {
    div.innerHTML = esc(text);
  } else {
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `${metaInfo ? metaInfo + " · " : ""}${timeStr}`;
    const body = document.createElement("div");
    body.innerHTML = esc(text);
    div.appendChild(meta);
    div.appendChild(body);

    chatHistory.push({
      timestamp: now.toISOString(),
      timeStr: timeStr,
      sender: sender,
      text: text,
      direction: type === "out" ? "Sent" : "Received",
      rssi: metaInfo
    });
    document.getElementById("msgCount").textContent = "Messages: " + chatHistory.length;
    document.getElementById("btnCsv").disabled = (chatHistory.length === 0);
  }

  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

// Download CSV of all messages
function downloadCsv() {
  if (chatHistory.length === 0) {
    alert("No messages to export yet.");
    return;
  }

  let csv = "Timestamp,Time,Direction,Sender,Message,Signal_Info\r\n";
  for (const m of chatHistory) {
    const cleanText = (m.text || "").replace(/"/g, '""');
    const cleanSender = (m.sender || "").replace(/"/g, '""');
    csv += `"${m.timestamp}","${m.timeStr}","${m.direction}","${cleanSender}","${cleanText}","${m.rssi}"\r\n`;
  }

  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const dateStr = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `lora_chat_log_${dateStr}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Web Bluetooth Connect / Disconnect
async function toggleConnect() {
  if (isConnected) {
    if (bleDevice && bleDevice.gatt.connected) {
      bleDevice.gatt.disconnect();
    }
    return;
  }

  if (!navigator.bluetooth) {
    alert("Web Bluetooth is not supported in this browser.\nPlease use Google Chrome on Android or Bluefy on iOS.");
    return;
  }

  try {
    addToLog("System", "Scanning for LoRa Chat nodes...", "sys");

    bleDevice = await navigator.bluetooth.requestDevice({
      filters: [
        { namePrefix: "XIAO_Chat" }
      ],
      optionalServices: [NUS_SERVICE_UUID]
    });

    bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

    addToLog("System", "Connecting to " + bleDevice.name + "...", "sys");
    const server = await bleDevice.gatt.connect();

    const service = await server.getPrimaryService(NUS_SERVICE_UUID);
    rxCharacteristic = await service.getCharacteristic(NUS_RX_UUID);
    txCharacteristic = await service.getCharacteristic(NUS_TX_UUID);

    await txCharacteristic.startNotifications();
    txCharacteristic.addEventListener('characteristicvaluechanged', handleIncomingData);

    setConnectedState(true, bleDevice.name);
    addToLog("System", "Connected to " + bleDevice.name + "! Ready to chat.", "sys");

    // Pre-fill name based on connected node
    if (bleDevice.name.includes("_A")) {
      document.getElementById("name").value = "UserA";
      document.getElementById("targetNode").textContent = "Node B";
    } else if (bleDevice.name.includes("_B")) {
      document.getElementById("name").value = "UserB";
      document.getElementById("targetNode").textContent = "Node A";
    }

  } catch (err) {
    console.error(err);
    addToLog("System", "Connection failed: " + err.message, "sys");
  }
}

function handleIncomingData(event) {
  const value = event.target.value;
  const decoder = new TextDecoder('utf-8');
  receiveBuffer += decoder.decode(value);

  // Process completed lines ending in \n
  let lines = receiveBuffer.split("\n");
  receiveBuffer = lines.pop(); // keep partial trailing line

  for (let line of lines) {
    line = line.trim();
    if (!line) continue;

    // Format 1: [Node A]: Hello world (RSSI: -47dBm)
    // Format 2: ✓ [Delivered to Node B]
    // Format 3: [You -> Node B]: Hello world
    if (line.startsWith("[Node ")) {
      const closingBracket = line.indexOf("]:");
      if (closingBracket > 0) {
        const sender = line.substring(1, closingBracket);
        let content = line.substring(closingBracket + 2).trim();
        let meta = sender;

        const rssiMatch = content.match(/\(RSSI:\s*([^)]+)\)/);
        if (rssiMatch) {
          meta += " · RSSI " + rssiMatch[1];
          content = content.replace(/\(RSSI:\s*[^)]+\)/, "").trim();
        }

        addToLog(sender, content, "in", meta);
      } else {
        addToLog("Radio", line, "in");
      }
    } else if (line.includes("Delivered")) {
      addToLog("Status", line, "sys");
    } else {
      addToLog("Node", line, "sys");
    }
  }
}

async function sendMsg() {
  const textEl = document.getElementById("text");
  const text = textEl.value.trim();
  const name = document.getElementById("name").value.trim() || "User";
  if (!text || !rxCharacteristic) return;

  textEl.value = "";

  try {
    // Send message through BLE UART
    const encoder = new TextEncoder();
    const data = encoder.encode(text + "\n");
    await rxCharacteristic.writeValue(data);

    addToLog(name, text, "out", "You (" + name + ")");
  } catch (err) {
    console.error("Send error:", err);
    addToLog("System", "Failed to send: " + err.message, "sys");
  }
}

function onDisconnected() {
  setConnectedState(false);
  addToLog("System", "Bluetooth device disconnected.", "sys");
}

function setConnectedState(connected, devName = "") {
  isConnected = connected;
  const badge = document.getElementById("statusBadge");
  const btn = document.getElementById("btnConnect");
  const textInput = document.getElementById("text");
  const sendBtn = document.getElementById("btnSend");

  if (connected) {
    badge.textContent = devName;
    badge.className = "status-badge connected";
    btn.textContent = "🔌 Disconnect";
    btn.className = "btn-disconnect";
    textInput.disabled = false;
    sendBtn.disabled = false;
    textInput.focus();
  } else {
    badge.textContent = "Disconnected";
    badge.className = "status-badge";
    btn.textContent = "🔗 Connect Bluetooth";
    btn.className = "";
    textInput.disabled = true;
    sendBtn.disabled = true;
  }
}

document.getElementById("text").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { sendMsg(); }
});
</script>
</body>
</html>
